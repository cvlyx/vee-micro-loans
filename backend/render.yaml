services:
  - type: web
    name: phoenix-loan-api
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: phoenix-loan-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: phoenix-loan-db
    databaseName: phoenix_loan
    user: phoenix_user
